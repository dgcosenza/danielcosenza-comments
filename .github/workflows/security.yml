# Scans the repository for committed secrets and audits GitHub Actions
# workflows on every pull request, every push to main and once a week.
# The weekly run catches rules and advisories published since the last run.
# Fix any finding before merging; rotate any secret that gitleaks finds.
name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * 1" # 09:41 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require actions pinned to a commit SHA
        run: bash .github/scripts/check-action-pins.sh

      # The release archive is checked against the SHA-256 that the gitleaks
      # 8.30.1 release publishes, so a replaced download cannot run here.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the whole history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action installs the zizmor release that its own lock file pins by
      # SHA-256, so this commit SHA fixes the zizmor version too. Any finding
      # fails the job; the annotations show it on the pull request.
      - name: Audit the workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
